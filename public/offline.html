<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#7a1530">
    <title>Sin conexión</title>
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: linear-gradient(160deg, #b8274a, #4a0d1f); color: #fff; text-align: center; padding: 1.5rem; }
        img { width: 96px; border-radius: 22px; box-shadow: 0 20px 40px -15px rgba(0,0,0,.6); }
        h1 { font-family: Georgia, serif; margin: 1.2rem 0 .4rem; }
        p { opacity: .85; max-width: 320px; margin: 0 auto 1.5rem; }
        button { border: 0; border-radius: 999px; padding: .8rem 1.5rem; font-weight: 700; background: #f5d27a; color: #2a0a12; font-size: 1rem; cursor: pointer; }
    </style>
</head>
<body>
    <main>
        <img src="/img/pwa/icono-192.png" alt="">
        <h1>Sin conexión</h1>
        <p>Parece que no tienes internet. Revisa tu conexión y vuelve a intentarlo.</p>
        <button onclick="location.reload()">Reintentar</button>
    </main>
</body>
</html>
